name: Deploy to GitHub Pages

# Builds the site and publishes it to this repo's GitHub Pages, at
# https://<owner>.github.io/<repo>/. Runs on every push to main, or by hand.
#
# One-time setup: Settings -> Pages -> Source: GitHub Actions. Until then this
# workflow says so and skips the deploy instead of failing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  Build-And-Deploy:
    runs-on: ubuntu-latest
    env:
      # A project page lives below the domain root, and the build fetches its scripts
      # root-absolute — so the base path is required, or every page loads blank.
      GEEKPRESENT_BASE_PATH: /${{ github.event.repository.name }}
      # The address for the absolute SEO tags and the sitemap. Change it here if you
      # serve the site from a custom domain.
      GEEKPRESENT_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Is GitHub Pages enabled?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --jq .build_type >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled yet. Settings -> Pages -> Source: GitHub Actions, then run this workflow again."
          fi

      - name: Check out the code
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: steps.pages.outputs.enabled == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Build
        if: steps.pages.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Setup Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      # include-hidden-files keeps build/.nojekyll. Without it Pages runs Jekyll, which
      # drops the _app/ folder, and every page loads blank.
      - name: Upload artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
